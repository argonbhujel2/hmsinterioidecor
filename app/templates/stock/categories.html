{% extends "base.html" %}
{% block title %}Stock Categories{% endblock %}
{% block content %}
<h2 style="margin-bottom:1rem">Stock categories</h2>
<div class="panel" style="max-width:480px;margin-bottom:1rem">
  <div class="panel-body">
    <form method="post" style="display:flex;gap:.5rem;flex-wrap:wrap">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="name" required placeholder="e.g. Gypsum Products" style="flex:1;padding:.45rem;border:1px solid var(--border);border-radius:8px">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
  </div>
</div>
<div class="panel">
  <div class="panel-body table-wrap">
    <table class="data">
      <thead><tr><th>Name</th><th></th></tr></thead>
      <tbody>
      {% for c in categories %}
        <tr>
          <td>{{ c.name }}</td>
          <td>
            <form method="post" action="{{ url_for('stock.delete_category', cid=c.id) }}" style="display:inline" onsubmit="return confirm('Delete category?');">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-outline btn-sm" style="color:#b91c1c">Delete</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="2">No categories. Suggested: Gypsum Products, Ceiling Products, Accessories, Tools.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<p><a href="{{ url_for('stock.list_items') }}">← Back to stock</a></p>
{% endblock %}
