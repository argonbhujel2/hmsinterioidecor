{% extends "base.html" %}
{% block title %}Maintenance{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px">
  <div class="panel-header">Maintenance mode</div>
  <div class="panel-body">
    <p style="color:var(--muted)">When enabled, only technical admin <strong>argon</strong> can use the staff portal. Others see a maintenance page with your logo.</p>
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label><input type="checkbox" name="maintenance_mode" value="1" {% if maintenance_mode %}checked{% endif %}> Enable maintenance mode</label>
      </div>
      <div class="form-group"><label>Message</label>
        <textarea name="maintenance_message" rows="3">{{ maintenance_message }}</textarea>
      </div>
      <div class="form-group"><label>Logo URL</label><input name="logo_url" value="{{ logo_url }}"></div>
      <div class="form-group"><label>Or upload logo</label><input type="file" name="logo_file" accept="image/*"></div>
      {% if logo_url %}<p><img src="{{ logo_url if logo_url.startswith('http') else url_for('static', filename=logo_url) }}" style="max-height:60px" alt="Logo"></p>{% endif %}
      <div class="form-group"><label>Favicon URL</label><input name="favicon_url" value="{{ favicon_url }}"></div>
      <div class="form-group"><label>Or upload favicon</label><input type="file" name="favicon_file" accept="image/*,.ico"></div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('settings.index') }}" class="btn btn-outline">Back</a>
    </form>
  </div>
</div>
{% endblock %}
